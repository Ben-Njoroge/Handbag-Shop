{% extends 'bagApp/base.html' %}
{% block content %}
<!-- Reduced top margin slightly on mobile -->
<div class="max-w-3xl mx-auto px-4 mt-6 md:mt-10 mb-16">
    <!-- Adjusted heading size for mobile -->
    <h1 class="text-2xl md:text-3xl font-serif text-gray-900 mb-6 md:mb-8 text-center">Get in Touch</h1>

    <!-- Changed p-8 to p-5 sm:p-8 so it doesn't squish inputs on mobile -->
    <div class="bg-white p-5 sm:p-8 rounded-xl shadow-sm border border-gray-100">

        <!-- Success Message Alert -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 bg-green-50 text-green-800 border border-green-200 rounded-md text-center text-sm sm:text-base">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Direct Contact Buttons -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
            <a href="https://wa.me/254740482762" target="_blank" class="flex items-center justify-center space-x-3 p-3 sm:p-4 bg-green-50 border border-green-200 rounded-xl hover:bg-green-100 transition-colors">
                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
                <span class="text-green-800 font-medium text-sm sm:text-base">Chat on WhatsApp</span>
            </a>

            <a href="mailto:bennymwangi03@gmail.com" class="flex items-center justify-center space-x-3 p-3 sm:p-4 bg-gray-50 border border-gray-200 rounded-xl hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span class="text-gray-800 font-medium text-sm sm:text-base">Email Us</span>
            </a>
        </div>

        <!-- Divider line -->
        <div class="flex items-center my-6 sm:my-8">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="px-4 text-xs sm:text-sm text-gray-500 uppercase tracking-wider">Or send us a message</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Existing Form with updated focus states and text sizing -->
        <form method="POST" action="{% url 'contact' %}" class="space-y-4 sm:space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" name="name" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black focus:border-black text-sm sm:text-base">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" name="email" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black focus:border-black text-sm sm:text-base">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Subject</label>
                <input type="text" name="subject" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black focus:border-black text-sm sm:text-base">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Message</label>
                <textarea name="message" rows="5" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black focus:border-black text-sm sm:text-base"></textarea>
            </div>
            <button type="submit" class="w-full bg-black text-white py-3 sm:py-4 rounded-md hover:bg-gray-800 text-base sm:text-lg font-medium transition-colors">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
