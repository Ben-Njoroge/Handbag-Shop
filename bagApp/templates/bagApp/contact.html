{% extends 'bagApp/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 mt-10 mb-16">
    <h1 class="text-3xl font-serif text-gray-900 mb-8 text-center">Get in Touch</h1>

    <div class="bg-white p-8 rounded-xl shadow-sm border">

        <!-- Success Message Alert -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 bg-green-50 text-green-800 border border-green-200 rounded-md text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- NEW: Direct Contact Buttons -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <!-- WhatsApp Button -->
            <!-- Note: Replace 2547XXXXXXXX with your actual business number, don't use the + sign -->
            <a href="https://wa.me/254740482762" target="_blank" class="flex items-center justify-center space-x-3 p-4 bg-green-50 border border-green-200 rounded-xl hover:bg-green-100 transition-colors">
                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
                <span class="text-green-800 font-medium">Chat on WhatsApp</span>
            </a>

            <!-- Email Button -->
            <!-- Note: Replace the email inside the mailto: link -->
            <a href="mailto:bennymwangi03@gmail.com" class="flex items-center justify-center space-x-3 p-4 bg-gray-50 border border-gray-200 rounded-xl hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span class="text-gray-800 font-medium">Email Us</span>
            </a>
        </div>

        <!-- Divider line -->
        <div class="flex items-center my-8">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="px-4 text-sm text-gray-500">Or send us a message</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Existing Form -->
        <form method="POST" action="{% url 'contact' %}" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" name="name" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" name="email" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Subject</label>
                <input type="text" name="subject" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Message</label>
                <textarea name="message" rows="5" required class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-black"></textarea>
            </div>
            <button type="submit" class="w-full bg-black text-white py-4 rounded-md hover:bg-gray-800 text-lg font-medium">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
