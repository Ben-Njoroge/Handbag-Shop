<!-- Reusable Product Card -->
<!-- The entire wrapper is now an 'a' tag, making it highly clickable on mobile -->
<a href="{% url 'product_detail' product.id %}" class="relative group flex flex-col h-full border border-transparent hover:border-gray-100 hover:shadow-sm rounded-lg p-2 transition-all">

    <!-- Status Badges -->
    <div class="absolute top-4 left-4 z-10 flex flex-col gap-2 pointer-events-none">
        {% if product.old_price %}
            <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-sm shadow-sm">SALE</span>
        {% endif %}

        {% if product.stock_quantity == 0 %}
            <span class="bg-gray-900 text-white text-xs font-bold px-2 py-1 rounded-sm shadow-sm">SOLD OUT</span>
        {% endif %}
    </div>

    <!-- Image Container -->
    <div class="block mb-4 overflow-hidden bg-gray-100 aspect-square rounded-md">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        {% else %}
            <div class="w-full h-full flex items-center justify-center text-gray-400">No Image</div>
        {% endif %}
    </div>

    <!-- Product Info -->
    <div class="flex flex-col flex-grow text-center px-2">
        <!-- Title -->
        <h3 class="text-gray-900 font-medium group-hover:text-gray-600 transition-colors">
            {{ product.name }}
        </h3>

        <!-- Price Display -->
        <div class="mt-1 flex items-center justify-center gap-2 mb-4">
            {% if product.old_price %}
                <del class="text-sm text-gray-400">KES {{ product.old_price }}</del>
            {% endif %}
            <span class="text-gray-900 font-semibold">KES {{ product.price }}</span>
        </div>

        <!-- Sleek View Details Prompt (Replaces Button) -->
        <div class="mt-auto pb-2">
            <span class="text-xs font-medium uppercase tracking-widest text-gray-500 group-hover:text-black border-b border-transparent group-hover:border-black pb-1 transition-all">
                View Details
            </span>
        </div>
    </div>
</a>
