{% extends 'bagApp/base.html' %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white p-8 border border-gray-200 rounded-lg shadow-sm">
        <h2 class="text-2xl font-serif text-gray-900 text-center mb-2">Welcome Back</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Log in to view your orders and saved items</p>

        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Email / Username</label>
                <input type="text" name="username" required class="w-full border border-gray-300 px-4 py-3 rounded-md focus:outline-none focus:ring-1 focus:ring-black focus:border-black text-sm" placeholder="Enter your email">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 px-4 py-3 rounded-md focus:outline-none focus:ring-1 focus:ring-black focus:border-black text-sm" placeholder="Enter your password">
            </div>

            <button type="submit" class="w-full bg-black text-white py-3 rounded-md font-medium text-sm hover:bg-gray-800 transition-colors mt-2">
                Log In
            </button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-6">
            Don't have an account?
            <a href="{% url 'register' %}" class="font-semibold text-black hover:underline">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
